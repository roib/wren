[project]
name = "wren"
version = "0.1.0"
description = "Self-hosted show downloader + podcast/video player PWA"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "yt-dlp[default]",
    "fastapi",
    "uvicorn[standard]",
    "pillow",  # podcast-feed artwork
    "pywebpush",  # alerts
    "tzdata",  # timezone data for WREN_TZ, even on systems without it
]

[project.scripts]
wren = "wren.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["wren"]

[tool.setuptools.package-data]
wren = ["*.png"]
