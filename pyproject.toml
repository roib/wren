[project]
name = "wren"
version = "0.1.0"
description = "Self-hosted show downloader + podcast/video player PWA"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp[default]",
    "fastapi",
    "uvicorn[standard]",
]

[project.scripts]
wren = "wren.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["wren"]
