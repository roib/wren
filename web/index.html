<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Wren</title>
  <meta name="theme-color" content="#0e0e10" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Wren">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png?v=bird">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="nav" id="nav">
    <a id="back" href="#/" hidden><span data-icon="chevronLeft"></span>Shows</a>
    <span class="nav-title" id="nav-title" aria-hidden="true"></span>
    <div class="nav-actions" id="nav-actions">
      <a id="alerts-link" class="icon-btn" href="#/alerts" aria-label="Alerts" data-icon="bell"><span id="alerts-badge" class="nav-badge" hidden></span></a>
      <a id="status-link" class="icon-btn" href="#/status" aria-label="Status" data-icon="pulse"></a>
      <a id="add-link" class="icon-btn" href="#/add" aria-label="Add a show or episode" data-icon="plus"></a>
    </div>
  </nav>
  <div id="scroller">
    <div class="scroll-inner">
      <header class="top">
        <h1 id="view-title">Shows</h1>
        <p id="view-sub" hidden></p>
      </header>
      <main id="view"></main>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <!-- Test player: the phone's own controls, in a sheet that swipes down to close. -->
  <section id="sheet" aria-label="Test playback" aria-hidden="true">
    <div class="sheet-inner">
      <button id="sheet-close" class="icon-btn" aria-label="Close player" data-icon="chevronDown"></button>
      <div class="player-wrap" id="player-wrap"></div>
      <div class="sheet-meta">
        <div id="sheet-title"></div>
        <div id="sheet-sub"></div>
      </div>
    </div>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
