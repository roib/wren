<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wren</title>
  <meta name="theme-color" content="#0e0e10" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Wren">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <nav class="nav">
      <a id="back" href="#/" hidden><span data-icon="chevronLeft"></span>Shows</a>
      <a id="settings-link" class="icon-btn" href="#/settings" aria-label="Settings" data-icon="settings"></a>
    </nav>
    <h1 id="view-title">Shows</h1>
    <p id="view-sub"></p>
  </header>

  <main>
    <ul id="list"></ul>

    <section id="settings" hidden>
      <h2>Subscriptions</h2>
      <form id="sub-form" class="card">
        <input id="sub-url" type="url" placeholder="YouTube channel or playlist URL" required autocomplete="off">
        <div class="segmented" role="radiogroup" aria-label="Format">
          <label><input type="radio" name="sub-mode" value="audio" checked><span>Audio</span></label>
          <label><input type="radio" name="sub-mode" value="video"><span>Video</span></label>
        </div>
        <button type="submit" class="primary" id="sub-submit">Subscribe</button>
      </form>
      <div class="card list-card" id="sub-list" hidden></div>
      <p class="hint" id="sub-status"></p>

      <h2>Add episode</h2>
      <form id="add-form" class="card">
        <input id="add-url" type="url" placeholder="Paste a video URL" required autocomplete="off">
        <div class="segmented" role="radiogroup" aria-label="Format">
          <label><input type="radio" name="mode" value="audio" checked><span>Audio</span></label>
          <label><input type="radio" name="mode" value="video"><span>Video</span></label>
        </div>
        <button type="submit" class="primary">Add</button>
      </form>

      <h2>Downloads</h2>
      <div class="card list-card">
        <div class="kv"><span>Saved on this device</span><span id="dl-count">—</span></div>
        <div class="kv"><span>Storage used</span><span id="dl-usage">—</span></div>
        <div id="clear-area"></div>
      </div>
      <p class="hint" id="dl-hint">Clearing removes only the copies saved on this device. Episodes stay in your library and can be downloaded again.</p>
    </section>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>

  <div id="mini" hidden>
    <div class="mini-progress"><div id="mini-bar"></div></div>
    <button id="mini-open" class="mini-main" aria-label="Open player">
      <img id="mini-thumb" alt="">
      <span class="mini-text">
        <span id="mini-title"></span>
        <span id="mini-sub"></span>
      </span>
    </button>
    <button id="mini-play" class="icon-btn" aria-label="Play"></button>
  </div>

  <section id="sheet" aria-label="Now playing" aria-hidden="true">
    <div class="sheet-inner">
      <button id="sheet-close" class="icon-btn" aria-label="Close player" data-icon="chevronDown"></button>
      <div class="art">
        <img id="sheet-art" alt="">
        <video id="media" playsinline preload="metadata"></video>
      </div>
      <div class="sheet-meta">
        <div id="sheet-title"></div>
        <div id="sheet-channel"></div>
      </div>
      <input id="seek" type="range" min="0" max="0" step="1" value="0" aria-label="Seek">
      <div class="times"><span id="cur">0:00</span><span id="remain">-0:00</span></div>
      <div class="transport">
        <button id="speed" class="chip" aria-label="Playback speed">1×</button>
        <button id="skip-back" class="icon-btn lg" aria-label="Back 15 seconds" data-icon="back"></button>
        <button id="play" class="play-btn" aria-label="Play"></button>
        <button id="skip-fwd" class="icon-btn lg" aria-label="Forward 30 seconds" data-icon="fwd"></button>
        <span class="chip ghost" aria-hidden="true"></span>
      </div>
    </div>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
